# rEngine build definition for cmkr (https://cmkr.build). Every CMakeLists.txt in this repository
# is generated from a cmake.toml by the pinned bootstrap in cmake/cmkr.cmake; edit the TOML, never
# the generated file. Targets mirror docs/specs/056-native-desktop.md and spec 067/068.

[cmake]
version = "3.24"
cmkr-include = "cmake/cmkr.cmake"

[project]
name = "rengine"
version = "0.1.0"
languages = ["C"]
cmake-after = """
include(CTest)
find_package(SDL2 2.32.10 EXACT CONFIG REQUIRED)
include(orchestrator/native/curl.cmake)
set(RENGINE_VENDOR "${PROJECT_SOURCE_DIR}/third_party")
find_program(RENGINE_NODE_EXECUTABLE NAMES node REQUIRED)
file(TO_CMAKE_PATH "${RENGINE_NODE_EXECUTABLE}" RENGINE_NODE_PATH)
"""

[conditions]
testing = "BUILD_TESTING"
not-msvc = "NOT MSVC"
msvc = "MSVC"

# --- pinned upstream libraries (third_party/sources.json) ---

[target.rengine_microui]
type = "static"
sources = ["third_party/microui/microui.c"]
cmake-after = """
target_include_directories(rengine_microui SYSTEM PUBLIC "${RENGINE_VENDOR}/microui")
"""

[target.rengine_json]
type = "static"
sources = ["third_party/cjson/cJSON.c"]
cmake-after = """
target_include_directories(rengine_json SYSTEM PUBLIC "${RENGINE_VENDOR}/cjson")
"""

[target.rengine_vterm]
type = "static"
sources = ["third_party/libvterm/src/*.c"]
private-compile-definitions = ["_CRT_SECURE_NO_WARNINGS"]
cmake-after = """
target_include_directories(rengine_vterm SYSTEM PUBLIC "${RENGINE_VENDOR}/libvterm/include")
"""

[target.rengine_svg]
type = "static"
sources = ["orchestrator/native/svg.c"]
cmake-after = """
target_include_directories(rengine_svg PRIVATE "${PROJECT_SOURCE_DIR}/orchestrator/native")
target_include_directories(rengine_svg SYSTEM PRIVATE "${RENGINE_VENDOR}/nanosvg") # pinned nanosvg (spec 104)
"""

[target.rengine_jpeg]
type = "static"
sources = ["orchestrator/native/jpeg.c"]
cmake-after = """
target_include_directories(rengine_jpeg PRIVATE "${PROJECT_SOURCE_DIR}/orchestrator/native")
target_include_directories(rengine_jpeg SYSTEM PRIVATE "${RENGINE_VENDOR}/stb") # pinned stb_image_write (spec 081)
"""

# --- owned desktop code ---

# --- renderer and controls: their own targets, so the library boundary is real (charter D30, D33) ---

[target.rengine_render]
type = "static"
sources = [
  "orchestrator/native/theme.c", "orchestrator/native/theme_file.c", "orchestrator/native/draw.c",
  "orchestrator/native/render/utf8.c", "orchestrator/native/render/draw_list.c",
  "orchestrator/native/render/font.c", "orchestrator/native/render/backend_sdl.c",
  "orchestrator/native/render/backend_gl.c", "orchestrator/native/render/backend_vk.c",
]
include-directories = ["orchestrator/native"]
link-libraries = ["SDL2::SDL2", "rengine_microui", "rengine_json"]
compile-features = ["c_std_11"]
compile-definitions = ["SDL_MAIN_HANDLED"]
cmake-after = """
target_include_directories(rengine_render SYSTEM PRIVATE "${RENGINE_VENDOR}/stb" "${RENGINE_VENDOR}")
target_compile_definitions(rengine_render PRIVATE RENGINE_FONT_DIR="${RENGINE_VENDOR}") # bundled UI and icon faces (spec 076)
if(NOT MSVC)
  target_compile_options(rengine_render PRIVATE -Wall -Wextra -Wpedantic)
  target_link_libraries(rengine_render PUBLIC m)
endif()
if(APPLE)
  # spec 072: the Metal adapter is the one Objective-C file, compiled with ARC and linked to Apple's frameworks.
  enable_language(OBJC)
  target_sources(rengine_render PRIVATE orchestrator/native/render/backend_metal.m)
  set_source_files_properties(orchestrator/native/render/backend_metal.m PROPERTIES COMPILE_OPTIONS "-fobjc-arc")
  target_link_libraries(rengine_render PUBLIC "-framework Metal" "-framework QuartzCore" "-framework Foundation")
endif()
"""

[target.rengine_ui]
type = "static"
sources = ["orchestrator/native/ui/ui.c"]
include-directories = ["orchestrator/native"]
link-libraries = ["rengine_render", "rengine_microui"]
compile-features = ["c_std_11"]
cmake-after = """
if(NOT MSVC)
  target_compile_options(rengine_ui PRIVATE -Wall -Wextra -Wpedantic)
endif()
"""

[target.rengine_desktop_core]
type = "static"
sources = [
  "orchestrator/native/layout.c", "orchestrator/native/net.c",
  "orchestrator/native/terminal.c", "orchestrator/native/editor.c", "orchestrator/native/syntax.c",
  "orchestrator/native/app.c",
  "orchestrator/native/workspace.c", "orchestrator/native/game.c", "orchestrator/native/scroll.c",
  "orchestrator/native/scene.c", "orchestrator/native/hexview.c", "orchestrator/native/formatview.c",
  "orchestrator/native/dashboard.c", "orchestrator/native/tracker.c", "orchestrator/native/recording.c", "orchestrator/native/devices.c",
  "orchestrator/native/token.c",
  "orchestrator/native/plugin.c", "orchestrator/native/pluginview.c",
]
include-directories = ["orchestrator/native"]
link-libraries = ["SDL2::SDL2", "rengine_ui", "rengine_render", "rengine_microui", "rengine_json", "rengine_vterm", "rengine_jpeg", "rengine_svg", "CURL::libcurl"]
compile-features = ["c_std_11"]
compile-definitions = ["SDL_MAIN_HANDLED"]
cmake-after = """
target_include_directories(rengine_desktop_core SYSTEM PRIVATE "${RENGINE_VENDOR}/stb" "${RENGINE_VENDOR}")
if(NOT MSVC)
  target_compile_options(rengine_desktop_core PRIVATE -Wall -Wextra -Wpedantic)
  target_link_libraries(rengine_desktop_core PUBLIC m)
endif()
target_link_libraries(rengine_desktop_core PUBLIC ${CMAKE_DL_LIBS}) # plugin.c: the one dlopen/LoadLibrary wrapper (spec 106)
"""

[target.rengine]
type = "executable"
sources = ["orchestrator/native/main.c", "orchestrator/native/automation.c", "orchestrator/native/bootstrap.c"]
private-link-libraries = ["rengine_desktop_core"]
cmake-after = """
target_compile_definitions(rengine PRIVATE RENGINE_NODE="${RENGINE_NODE_PATH}"
  RENGINE_BOOTSTRAP="${PROJECT_SOURCE_DIR}/orchestrator/runtime/bootstrap.mjs")
set_target_properties(rengine PROPERTIES RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/bin")
if(WIN32)
  add_custom_command(TARGET rengine POST_BUILD COMMAND ${CMAKE_COMMAND} -E copy_if_different
    $<TARGET_FILE:SDL2::SDL2> $<TARGET_FILE_DIR:rengine>)
endif()
"""

