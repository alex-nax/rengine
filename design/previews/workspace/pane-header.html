<!-- @dsCard group="Workspace" viewport="760x300" name="Pane header" subtitle="Tab strip states: active, hover, dirty, ellipsized title, overflow navigation, empty pane" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rEngine · Pane header</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.stack{display:flex;flex-direction:column;gap:14px;padding:16px}
.re-window{width:728px}
.cap{font-size:var(--ui-size-sm);color:var(--ui-fg-faint);margin:0 0 4px 2px}
.empty{height:60px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ui-fg-faint)}
</style>
</head>
<body>
<div class="stack">
  <div><p class="cap">Active · hover · dirty · clipped title · overflow</p>
  <div class="re-window"><div class="re-tabs">
    <span class="re-tab is-active"><span class="title">HUD.cpp</span><span class="dirty"></span><span class="close">✕</span></span>
    <span class="re-tab is-hover"><span class="title">000-charter.md</span><span class="close">✕</span></span>
    <span class="re-tab"><span class="re-icon">›_</span><span class="title">Shell · nolf-improved</span><span class="close">✕</span></span>
    <span class="re-tab"><span class="title">AVeryLongTranslationUnitName.cpp</span><span class="dirty"></span><span class="close">✕</span></span>
    <span class="spacer"></span>
    <span class="nav"><span class="re-button ghost icon"><span class="re-icon">‹</span></span><span class="re-button ghost icon is-disabled"><span class="re-icon">›</span></span><span class="re-label muted" style="font-size:var(--ui-size-sm);padding:0 4px">+3</span><span class="re-button ghost icon"><span class="re-icon">+</span></span></span>
  </div><div style="height:28px"></div></div></div>
  <div><p class="cap">Single view, no close on the last tab of a locked pane</p>
  <div class="re-window"><div class="re-tabs"><span class="re-tab is-active"><span class="re-icon">⊟</span><span class="title">Project</span></span></div><div style="height:28px"></div></div></div>
  <div><p class="cap">Empty pane</p>
  <div class="re-window"><div class="re-tabs"><span class="spacer"></span><span class="nav"><span class="re-button ghost icon"><span class="re-icon">+</span></span></span></div><div class="empty"><span class="re-button ghost"><span class="re-icon">›_</span>New shell</span><span class="re-button ghost"><span class="re-icon">◆</span>New agent</span><span class="re-label muted">or drop a file here</span></div></div></div>
</div>
</body>
</html>
