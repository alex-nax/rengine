<!-- @dsCard group="Views" viewport="960x340" name="Session browser" subtitle="Retained processes with live state, Attach/Stop, then recovery drafts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rEngine · Sessions</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.re-pane{left:8px;top:8px;width:944px;height:324px}
.hdr{border-bottom:1px solid var(--ui-border);background:var(--ui-surface-sunken)}
.hdr .re-kicker{width:0;flex:1}
.list .re-row{border-bottom:1px solid var(--ui-border-soft);height:30px}
.list .re-row:hover{background:var(--ui-highlight)}
.c1{flex:0 0 220px}.c2{flex:1}.c3{flex:0 0 160px}.c4{flex:0 0 150px;display:flex;gap:4px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;height:18px;padding:0 8px;border-radius:9px;background:var(--ui-control);font-size:var(--ui-size-sm);color:var(--ui-fg)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ui-ok)}.pill.idle .dot{background:var(--ui-fg-faint)}
.list .c4 .re-button{height:20px}
</style>
</head>
<body>
<div class="re-pane">
  <div class="re-tabs"><span class="re-tab is-active"><span class="re-icon">≡</span><span class="title">Sessions</span><span class="close">✕</span></span></div>
  <div class="re-content">
    <div class="re-row hdr gap-lg"><span class="re-kicker c1">Session</span><span class="re-kicker c2">Command</span><span class="re-kicker c3">State</span><span class="re-kicker c4"></span></div>
    <div class="list">
      <div class="re-row gap-lg"><span class="re-label c1"><span class="re-icon">◆</span>Codex · rengine</span><span class="re-label muted c2 mono">codex --project . --model o4</span><span class="c3"><span class="pill"><span class="dot"></span>running · 12 min</span></span><span class="c4"><span class="re-button">Attach</span><span class="re-button ghost danger">Stop</span></span></div>
      <div class="re-row gap-lg"><span class="re-label c1"><span class="re-icon">›_</span>Shell · nolf-improved</span><span class="re-label muted c2 mono">zsh</span><span class="c3"><span class="pill idle"><span class="dot"></span>idle · 1 h</span></span><span class="c4"><span class="re-button">Attach</span><span class="re-button ghost danger">Stop</span></span></div>
      <div class="re-row gap-lg"><span class="re-label c1"><span class="re-icon">›_</span>Shell · build</span><span class="re-label muted c2 mono">cmake --build build -j8</span><span class="c3"><span class="pill"><span class="dot"></span>running · 0:42</span></span><span class="c4"><span class="re-button">Attach</span><span class="re-button ghost danger">Stop</span></span></div>
    </div>
    <div class="re-row hdr gap-lg" style="margin-top:12px"><span class="re-kicker c1">Recovery drafts</span><span class="re-kicker c2">Path</span><span class="re-kicker c3">Saved</span><span class="re-kicker c4"></span></div>
    <div class="list">
      <div class="re-row gap-lg"><span class="re-label c1"><span class="re-icon">▪</span>HUD.cpp</span><span class="re-label muted c2">Game/ClientShell/HUD.cpp</span><span class="re-label muted c3">2 min ago</span><span class="c4"><span class="re-button">Open</span><span class="re-button ghost">Discard</span></span></div>
    </div>
  </div>
</div>
</body>
</html>
