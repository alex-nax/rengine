<!-- @dsCard group="Views" viewport="700x440" name="Game tab" subtitle="Capture controls and frame stats above the letterboxed live texture" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rEngine · Game</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.re-pane{left:8px;top:8px;width:684px;height:424px}
.bar{border-bottom:1px solid var(--ui-border)}
.stage{position:absolute;left:0;right:0;top:23px;bottom:0;background:var(--game-backdrop);display:flex;align-items:center;justify-content:center}
.tex{width:560px;height:315px;background:repeating-linear-gradient(135deg,#1c1c1c 0 8px,#222 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--ui-fg-faint);font-family:var(--ui-mono);font-size:var(--ui-size-sm);position:relative}
.tex::after{content:"live game texture · 1280×720 letterboxed";position:absolute}
.rec{width:8px;height:8px;border-radius:50%;background:var(--ui-err)}
</style>
</head>
<body>
<div class="re-pane">
  <div class="re-tabs"><span class="re-tab is-active"><span class="re-icon">▶</span><span class="title">NOLF</span><span class="close">✕</span></span></div>
  <div class="re-content">
    <div class="re-row bar"><span class="re-button primary" style="height:18px"><span class="rec" style="background:var(--ui-fg-on-accent)"></span>Capture</span><span class="re-button ghost" style="height:18px">Screenshot</span><span class="re-sep"></span><span class="re-label muted">1280×720 · 144 fps · 6.9 ms</span><span class="spacer"></span><span class="re-checkbox is-on"><span class="box"></span>Follow window</span><span class="re-sep"></span><span class="re-label muted"><span class="rec"></span>REC 00:12</span></div>
    <div class="stage"><div class="tex"></div></div>
  </div>
</div>
</body>
</html>
