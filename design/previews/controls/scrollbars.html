<!-- @dsCard group="Controls" viewport="640x300" name="Scrollbars" subtitle="10px overlay bars with rounded thumbs: rest, hover and dragging (accent)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rEngine · Scrollbars</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.wrap{display:flex;gap:28px;align-items:flex-start;margin-top:16px}
.box{position:relative;width:150px;height:150px;background:var(--editor-bg);border:1px solid var(--ui-border);border-radius:var(--ui-radius);overflow:hidden}
.box .re-scrollbar.vertical{position:absolute;right:0;top:0;bottom:0}
.box .re-scrollbar.horizontal{position:absolute;left:0;right:10px;bottom:0}
.cap{margin-top:8px;font-size:var(--ui-size-sm);color:var(--ui-fg-faint)}
</style>
</head>
<body>
<div class="re-card">
  <h1>Scrollbars</h1>
  <p class="re-note">Track is transparent; the thumb is the only mark. Minimum thumb 20px, 2px inset, radius half its width. Dragging switches to the accent so the pointer target is unambiguous.</p>
  <div class="wrap">
    <div><div class="box"><div class="re-scrollbar vertical"><div class="thumb" style="top:12px;height:56px"></div></div><div class="re-scrollbar horizontal"><div class="thumb" style="left:8px;width:70px"></div></div></div><div class="cap">Rest</div></div>
    <div><div class="box"><div class="re-scrollbar vertical is-hover"><div class="thumb" style="top:12px;height:56px"></div></div></div><div class="cap">Hover</div></div>
    <div><div class="box"><div class="re-scrollbar vertical is-dragging"><div class="thumb" style="top:40px;height:56px"></div></div></div><div class="cap">Dragging</div></div>
  </div>
</div>
</body>
</html>
