# The declared agent recipe registry (spec 114, charter D46; the data form is F148a, spec 129).
#
# This document is the ONE recipe table: the red-agents crate parses it, and every consumer —
# the desktop, the server, agent.sh and the thin JS client — reads it through that one parser,
# so adding an agent is a data edit. A consumer project proves exactly that by naming its own file in
# RENGINE_AGENT_REGISTRY_EXTRA — same shape, recipes this document does not already declare.
#
# The subset the parser implements, refusing the rest by name: comments, [table] and
# [table.sub] headers, key = value with basic strings ("..."), literal strings ('...' — the id
# shapes, so their backslashes need no escaping), integers, booleans, and one-line arrays of
# those. An absent capability is an OMITTED table — TOML has no null. A recipe that omits a
# capability is refused by name for that capability alone, by the consumer, and works for the
# rest. The read side of a resume spelling is DECLARED too, in `conversation.read` (spec 141):
# red-agents implements the spellings ('flags', 'subcommand') and knows no agent by name.

[recipes.claude]
package = "@anthropic-ai/claude-code"

[recipes.claude.update]
kind = "self"
command = "update"

[recipes.claude.model]
flag = "--model"

[recipes.claude.models]
kind = "static"
list = ["claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
default = "claude-opus-5"

# How this CLI is handed the brief a spawn carries (F221, spec 149). The KIND is what rEngine
# implements — `argv` puts the brief in the CLI's last positional argument, `paste` types it into the
# pane — and a recipe that declares neither is refused by name rather than started with a bare
# positional it would read as a subcommand and exit on.
[recipes.claude.prompt]
kind = "argv"

[recipes.claude.conversation]
ids = '^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
parser = "claude-flags"
normalize = "lowercase"
provider = "claude"
resumeLine = "claude --resume {id}"

# How this CLI's own argv SPELLS a conversation: the read side, declared rather than coded
# (spec 141). `flags` scans for naming flags and opaque ones; the id is validated against `ids`
# above and normalised by `normalize`, so no shape is hand-rolled anywhere.
[recipes.claude.conversation.read]
kind = "flags"
names = ["--session-id", "--resume", "-r"]
opaque = ["--fork-session", "-c", "--continue"]

[recipes.claude.conversation.start]
args = ["--session-id"]

[recipes.claude.conversation.resume]
args = ["--resume"]

[recipes.claude.conversation.short]
length = 8

[recipes.claude.mcp]
kind = "flag"
# The flag this CLI consumes the generic configuration with. The launch path knows the KIND of
# overlay; the spelling is the recipe's (F214, spec 141).
flag = "--mcp-config"

[recipes.claude.hooks]
kind = "per-launch-settings"
# And the flag that hands the CLI the settings file written for this launch.
flag = "--settings"

# What this CLI stamps on every process it starts, naming that one session. A pane that inherited
# them would be a CHILD session of whoever started the host (KI-113), so the launch environment
# scrubs the union of what every recipe declares here — a CLI that stamps its own is scrubbed by
# saying so, with no shared-code edit (F220, spec 141).
[recipes.claude.identity]
vars = ["CLAUDECODE", "CLAUDE_PID", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_CHILD_SESSION", "CLAUDE_CODE_SESSION_ID", "CLAUDE_CODE_SESSION_ATTENDED", "CLAUDE_CODE_BRIDGE_SESSION_ID", "CLAUDE_CODE_EXECPATH", "CLAUDE_CODE_MESSAGING_SOCKET", "CLAUDE_CODE_MESSAGING_TOKEN"]

[recipes.claude.ide]
flags = ["--ide"]
envVar = "CLAUDE_CODE_SSE_PORT"
# The rest of this CLI's IDE protocol, which red-ide implements and does not name: where the CLI
# looks for a published editor, the variable that moves that directory, and the header it presents
# the lock's token in. Measured against a real CLI — a version that moves any of them changes this
# declaration rather than a source file (F220, spec 141).
configVar = "CLAUDE_CONFIG_DIR"
configDirectory = ".claude"
authHeader = "x-claude-code-ide-authorization"

[recipes.codex]
package = "@openai/codex"

[recipes.codex.update]
kind = "self"
command = "update"

[recipes.codex.model]
flag = "-m"

[recipes.codex.models]
kind = "help"

[recipes.codex.prompt]
kind = "argv"

[recipes.codex.conversation]
ids = '^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
parser = "codex-resume"
normalize = "lowercase"
provider = "codex"
resumeLine = "codex resume {id}"

# What this CLI can be HANDED: a paused conversation named by a manifest, which rEngine confirms
# exists on this machine before launching a pane that would otherwise start a new conversation
# wearing the old one's name. `kind` says how this CLI stores its conversations, and red-host
# implements the kinds — a CLI declaring a kind rEngine has no reader for is refused by that kind,
# never by its name (F216, spec 141). `ready` is what "ready to resume" means for this CLI: each
# probe is run with the CLI's own executable and must succeed before a pane is launched.
[recipes.codex.conversation.handoff]
kind = "rollout-jsonl"
ready = ["resume --help", "login status"]

# codex names a conversation with a positional after a subcommand rather than with a flag, so the
# scan skips flags that take values and reads the first bare word.
[recipes.codex.conversation.read]
kind = "subcommand"
word = "resume"
valueFlags = ["-c", "--config", "-m", "--model", "-p", "--profile", "-i", "--image"]

[recipes.codex.conversation.resume]
args = ["resume"]

[recipes.codex.conversation.short]
length = 8

[recipes.codex.mcp]
kind = "config-args"
# The flag each configuration entry rides on. Same key as the `flag` overlay's: "the flag this CLI
# consumes its configuration with", spelled by the recipe rather than by the arm (F214/F218).
flag = "-c"

[recipes.codex.hooks]
kind = "per-launch-config"

[recipes.gemini]
package = "@google/gemini-cli"

[recipes.gemini.update]
kind = "reinstall"

[recipes.gemini.models]
kind = "none"

[recipes.gemini.mcp]
kind = "env-defaults"
# The environment variable naming the defaults FILE this CLI reads. `envVar` elsewhere carries
# configuration text inline; this one carries a path, so it is its own declaration (F214, spec 141).
pathVar = "GEMINI_CLI_SYSTEM_DEFAULTS_PATH"
# And the file written for it, named by the recipe rather than by shared code. `path` is always the
# file an overlay writes, relative to the base its KIND implies: the project root for
# `project-file`, this launch's own directory for `env-defaults`.
path = "gemini-defaults.json"

[recipes.opencode]
package = "opencode-ai"

[recipes.opencode.update]
kind = "self"
command = "upgrade"

[recipes.opencode.models]
kind = "none"

# Where this CLI installs itself, relative to the person's home directory. A launch adds every
# declared one to PATH so a CLI installed by its own installer is found (F220, spec 141).
[recipes.opencode.install]
path = ".opencode/bin"

[recipes.opencode.mcp]
kind = "env-inline"
envVar = "OPENCODE_CONFIG_CONTENT"

[recipes.kimi]
package = "@moonshot-ai/kimi-code"

[recipes.kimi.update]
kind = "self"
command = "upgrade"

[recipes.kimi.model]
flag = "-m"

[recipes.kimi.models]
kind = "none"

# kimi parses a bare positional as a SUBCOMMAND, so a brief passed as one exits the pane in about
# two seconds. Its composer takes a bracketed paste whole; spec 149 records what was measured.
[recipes.kimi.prompt]
kind = "paste"

# And how it takes a message into a composer that is ALREADY running (F222, spec 148). A separate
# key from `prompt` on purpose: that one is about a command line, and a CLI's command line says
# nothing about its composer. Declared here because spec 146 measured this composer's echo — a
# single line comes back verbatim, which is the only thing that can earn an Enter. No other recipe
# declares one: measuring a running composer means typing into a live conversation, and a kind
# nobody measured is a keystroke nobody can predict.
[recipes.kimi.message]
kind = "paste"

[recipes.kimi.conversation]
ids = '^(?:session_)?(?:[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}|[0-9A-HJKMNP-TV-Z]{26})$'
parser = "kimi-flags"
normalize = "none"
provider = "kimi"
resumeLine = "kimi --session {id}"

[recipes.kimi.conversation.read]
kind = "flags"
names = ["--session", "-S", "--resume", "-r"]
opaque = ["-c", "--continue"]

[recipes.kimi.conversation.resume]
args = ["--session"]

[recipes.kimi.conversation.short]
stripPrefix = "session_"
length = 8

[recipes.kimi.mcp]
kind = "project-file"
# Where the overlay is written, relative to the project root. The launch path knows the KIND of
# overlay; which file this CLI reads is the recipe's to say (F214, spec 141).
path = ".kimi-code/mcp.json"

[recipes.kimi.hooks]
kind = "guided-bootstrap"
