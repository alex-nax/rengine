# The declared agent recipe registry (spec 114, charter D46; the data form is F148a, spec 129).
#
# This document is the ONE recipe table: the red-agents crate parses it, and every consumer —
# the desktop, the server, agent.sh and the thin JS client — reads it through that one parser,
# so adding an agent is a data edit. A consumer project proves exactly that by naming its own file in
# RENGINE_AGENT_REGISTRY_EXTRA — same shape, recipes this document does not already declare.
#
# The subset the parser implements, refusing the rest by name: comments, [table] and
# [table.sub] headers, key = value with basic strings ("..."), literal strings ('...' — the id
# shapes, so their backslashes need no escaping), integers, booleans, and one-line arrays of
# those. An absent capability is an OMITTED table — TOML has no null. A recipe that omits a
# capability is refused by name for that capability alone, by the consumer, and works for the
# rest. The read side of a resume spelling is DECLARED too, in `conversation.read` (spec 141):
# red-agents implements the spellings ('flags', 'subcommand') and knows no agent by name.

[recipes.claude]
package = "@anthropic-ai/claude-code"

[recipes.claude.update]
kind = "self"
command = "update"

[recipes.claude.model]
flag = "--model"

[recipes.claude.models]
kind = "static"
list = ["claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
default = "claude-opus-5"

[recipes.claude.conversation]
ids = '^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
parser = "claude-flags"
normalize = "lowercase"
provider = "claude"
resumeLine = "claude --resume {id}"

# How this CLI's own argv SPELLS a conversation: the read side, declared rather than coded
# (spec 141). `flags` scans for naming flags and opaque ones; the id is validated against `ids`
# above and normalised by `normalize`, so no shape is hand-rolled anywhere.
[recipes.claude.conversation.read]
kind = "flags"
names = ["--session-id", "--resume", "-r"]
opaque = ["--fork-session", "-c", "--continue"]

[recipes.claude.conversation.start]
args = ["--session-id"]

[recipes.claude.conversation.resume]
args = ["--resume"]

[recipes.claude.conversation.short]
length = 8

[recipes.claude.mcp]
kind = "flag"
# The flag this CLI consumes the generic configuration with. The launch path knows the KIND of
# overlay; the spelling is the recipe's (F214, spec 141).
flag = "--mcp-config"

[recipes.claude.hooks]
kind = "per-launch-settings"
# And the flag that hands the CLI the settings file written for this launch.
flag = "--settings"

[recipes.claude.ide]
flags = ["--ide"]
envVar = "CLAUDE_CODE_SSE_PORT"

[recipes.codex]
package = "@openai/codex"

[recipes.codex.update]
kind = "self"
command = "update"

[recipes.codex.model]
flag = "-m"

[recipes.codex.models]
kind = "help"

[recipes.codex.conversation]
ids = '^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
parser = "codex-resume"
normalize = "lowercase"
provider = "codex"
resumeLine = "codex resume {id}"

# codex names a conversation with a positional after a subcommand rather than with a flag, so the
# scan skips flags that take values and reads the first bare word.
[recipes.codex.conversation.read]
kind = "subcommand"
word = "resume"
valueFlags = ["-c", "--config", "-m", "--model", "-p", "--profile", "-i", "--image"]

[recipes.codex.conversation.resume]
args = ["resume"]

[recipes.codex.conversation.short]
length = 8

[recipes.codex.mcp]
kind = "config-args"

[recipes.codex.hooks]
kind = "per-launch-config"

[recipes.gemini]
package = "@google/gemini-cli"

[recipes.gemini.update]
kind = "reinstall"

[recipes.gemini.models]
kind = "none"

[recipes.gemini.mcp]
kind = "env-defaults"
# The environment variable naming the defaults FILE this CLI reads. `envVar` elsewhere carries
# configuration text inline; this one carries a path, so it is its own declaration (F214, spec 141).
pathVar = "GEMINI_CLI_SYSTEM_DEFAULTS_PATH"
# And the file written for it, named by the recipe rather than by shared code. `path` is always the
# file an overlay writes, relative to the base its KIND implies: the project root for
# `project-file`, this launch's own directory for `env-defaults`.
path = "gemini-defaults.json"

[recipes.opencode]
package = "opencode-ai"

[recipes.opencode.update]
kind = "self"
command = "upgrade"

[recipes.opencode.models]
kind = "none"

[recipes.opencode.mcp]
kind = "env-inline"
envVar = "OPENCODE_CONFIG_CONTENT"

[recipes.kimi]
package = "@moonshot-ai/kimi-code"

[recipes.kimi.update]
kind = "self"
command = "upgrade"

[recipes.kimi.model]
flag = "-m"

[recipes.kimi.models]
kind = "none"

[recipes.kimi.conversation]
ids = '^(?:session_)?(?:[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}|[0-9A-HJKMNP-TV-Z]{26})$'
parser = "kimi-flags"
normalize = "none"
provider = "kimi"
resumeLine = "kimi --session {id}"

[recipes.kimi.conversation.read]
kind = "flags"
names = ["--session", "-S", "--resume", "-r"]
opaque = ["-c", "--continue"]

[recipes.kimi.conversation.resume]
args = ["--session"]

[recipes.kimi.conversation.short]
stripPrefix = "session_"
length = 8

[recipes.kimi.mcp]
kind = "project-file"
# Where the overlay is written, relative to the project root. The launch path knows the KIND of
# overlay; which file this CLI reads is the recipe's to say (F214, spec 141).
path = ".kimi-code/mcp.json"

[recipes.kimi.hooks]
kind = "guided-bootstrap"
