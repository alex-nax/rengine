[package]
name = "red-agents"
version = "0.1.0"
edition = "2021"
description = "The agent recipe registry as data: one TOML document the remaining JS and this crate both parse (F148a, spec 129, KI-092; charter D46)"

# serde_json only: the subset TOML parser is hand-rolled on purpose, so this crate accepts
# exactly the grammar the JS parser accepts — a general TOML dependency would parse a superset
# and the cross-language parity proof would have a hole where an author makes a mistake.
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"
# The registry declares each CLI's session-id shape as a pattern, and the JS this replaces matched
# it with a real regex engine. Interpreting the pattern by sniffing for substrings picked the wrong
# alternative for kimi, whose ids accept a uuid OR a ULID -- so the pattern is matched, not guessed.
regex = "1"
sha2 = "0.10"
# The one way this workspace reads a descriptor and reaches a loopback workspace (F159, spec 144).
# Taken deliberately despite the note above: the TOML parser stays hand-rolled for the parity it was
# written for, and "is this descriptor mine, and is its process alive?" had four answers in this tree
# until it had one. Measured before taking it — no binary here grew.
red-core = { path = "../red-core" }

# The projection dump: prints what the registry resolves to, so the JS parity test can compare
# the two sides of the one document. A binary rather than a test, as red-contract is.
# The stdio service the JS consumers read recipes through (F173): one process, one channel, the
# same shape red-store-serve established.
[[bin]]
name = "red-agents-serve"
path = "src/bin/red_agents_serve.rs"

[[bin]]
name = "red-agents-dump"
path = "src/bin/red_agents_dump.rs"

# The spawn-environment answerer: computes the ported pane composition and shell envelope for
# fixtures the JS suite owns (F168), the same harness shape.
[[bin]]
name = "red-agent-env"
path = "src/bin/red_agent_env.rs"
