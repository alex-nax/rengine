[package]
name = "red-project"
version = "0.1.0"
edition = "2021"
description = "What a project declares about itself, and the artifacts it produces: recordings today, the declaration and its formats next (F153-F156, spec 129)"

[dependencies]
# `utf16_len`: every bound in this crate was written against JavaScript's String#length, which
# counts UTF-16 code units rather than code points.
red-core = { path = "../red-core" }
# PKCE's S256 challenge (F154, spec 083): the provider recomputes it from the verifier, so the
# digest is a contract rather than an implementation detail.
sha2 = "0.10"
# The bounded JSON Schema 2020-12 subset with identical error strings, ported in F169/F147a: the
# declaration is validated by the same code the store validates with.
red-store = { path = "../red-store" }
# The recipe registry: which CLIs there are, which models each offers and how it is told one.
red-agents = { path = "../red-agents" }
serde_json = { version = "1", features = ["preserve_order"] }

# A declared command runs in its own process group so a timeout takes what it started with it, and
# a holder's liveness is `kill(pid, 0)`. Already in the lock through getrandom.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# One binary, one subcommand per question, so a JS caller that still needs an answer asks the same
# implementation red-host does rather than keeping a second one in JavaScript.
[[bin]]
name = "red-project"
path = "src/bin/red_project.rs"
