[package]
name = "red-worker"
version = "0.1.0"
edition = "2021"
description = "The root-bound workspace worker in Rust: the lifecycle feed and the project token (F158, spec 129, D57)"

[dependencies]
# The feed socket, the same implementation the door speaks WebSocket with.
tokio-tungstenite = "0.30"
futures-util = "0.3"
red-core = { path = "../red-core" }
# The ledger and the feed themselves (F157): this crate serves them, it does not own them.
red-token = { path = "../red-token" }
serde_json = { version = "1", features = ["preserve_order"] }
red-project = { path = "../red-project" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# The worker as a process: the supervisor spawns this where it spawned node.
[[bin]]
name = "red-worker"
path = "src/bin/red_worker.rs"
