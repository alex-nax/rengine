[package]
name = "red-host"
version = "0.1.0"
edition = "2021"
description = "The workspace's front door: the Rust host core (F152, spec 129, D57)"

[dependencies]
# The `/events` socket. 0.30 is already in this workspace's lockfile through libp2p-websocket,
# so the door speaks WebSocket with the same implementation the rest of the workspace links.
tokio-tungstenite = "0.30"
futures-util = "0.3"
red-core = { path = "../red-core" }
# A pane's title carries the conversation's short form, and the short form is the CLI's recipe
# (a prefix to strip, a length) rather than a rule this crate may invent (F148/F149).
red-agents = { path = "../red-agents" }
# What a project declares about itself and what it leaves behind: the door answers those routes from
# the same implementation the JS host's clients ask for (F156).
red-project = { path = "../red-project" }
serde_json = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
