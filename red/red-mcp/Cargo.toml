[package]
name = "red-mcp"
version = "0.1.0"
edition = "2021"
description = "The root-bound MCP server of the Rust orchestrator (F150, spec 129, D57)"

[dependencies]
red-core = { path = "../red-core" }
# preserve_order, because `content[0].text` is JSON.stringify of the answer: a map that sorted its
# keys would answer the same data in a different string, and the string is what an agent reads.
serde_json = { version = "1", features = ["preserve_order"] }
